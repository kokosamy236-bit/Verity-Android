name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libasound2-dev libpulse-dev libdbus-1-dev libgl1-mesa-dev libgles2-mesa-dev ccache
          pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-accept Android Licenses & Build APK
        run: |
          # قبول تراخيص الأندرويد تلقائياً عبر نسخ تراخيص النظام
          mkdir -p ~/.android/licenses
          cp -r $ANDROID_HOME/licenses/* ~/.android/licenses/ 2>/dev/null || true

          # إنشاء وتعديل ملف الإعدادات
          buildozer init
          sed -i 's/.*android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec

          # نسخ التراخيص إلى مجلد buildozer الداخلي أيضاً
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -r ~/.android/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true

          # بدء التجميع
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Verity-APK
          path: bin/*.apk
